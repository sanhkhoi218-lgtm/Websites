<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyShop - Cửa hàng trực tuyến</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f6fa;
    color: #222;
}

header {
    background: #222;
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #ffb703;
}

.cart-btn {
    background: #ffb703;
    color: #222;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.hero {
    text-align: center;
    padding: 65px 20px;
    background: linear-gradient(120deg, #2193b0, #6dd5ed);
    color: white;
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 15px;
}

.hero p {
    font-size: 17px;
}

.container {
    width: 86%;
    margin: 35px auto;
}

.search {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 25px;
    font-size: 16px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
}

.product {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px #00000010;
    transition: .3s;
}

.product:hover {
    transform: translateY(-5px);
}

.product img {
    width: 100%;
    height: 210px;
    object-fit: cover;
}

.product-info {
    padding: 18px;
}

.product-info h3 {
    margin-bottom: 10px;
}

.price {
    color: #e63946;
    font-size: 19px;
    font-weight: bold;
    margin: 12px 0;
}

.add-btn {
    width: 100%;
    padding: 12px;
    background: #222;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

.add-btn:hover {
    background: #ffb703;
    color: #222;
}

.cart {
    background: white;
    padding: 25px;
    margin-top: 35px;
    border-radius: 12px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid #eee;
}

.cart-item button {
    padding: 4px 9px;
    cursor: pointer;
}

.total {
    text-align: right;
    font-size: 22px;
    font-weight: bold;
    margin: 20px 0;
    color: #e63946;
}

.order-btn {
    background: #16a34a;
    color: white;
    padding: 14px 25px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    font-size: 16px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 7px;
}

footer {
    text-align: center;
    background: #222;
    color: white;
    padding: 25px;
    margin-top: 50px;
}

@media(max-width: 600px) {
    .hero h1 { font-size: 28px; }
    .container { width: 92%; }
}
</style>
</head>

<body>

<header>
    <div class="logo">🛍️ MyShop</div>
    <button class="cart-btn" onclick="goToCart()">
        🛒 Giỏ hàng (<span id="count">0</span>)
    </button>
</header>

<section class="hero">
    <h1>Chào mừng đến MyShop</h1>
    <p>Mua sắm dễ dàng - Giá cả hợp lý - Giao hàng tận nơi</p>
</section>

<div class="container">

    <input
        class="search"
        id="search"
        placeholder="🔍 Tìm kiếm sản phẩm..."
        oninput="renderProducts()"
    >

    <h2 style="margin-bottom:20px">✨ Sản phẩm nổi bật</h2>

    <div class="products" id="products"></div>

    <section class="cart" id="cart">
        <h2>🛒 Giỏ hàng của bạn</h2>
        <div id="cart-items">
            Chưa có sản phẩm nào.
        </div>

        <div class="total">
            Tổng: <span id="total">0đ</span>
        </div>

        <h3>Thông tin đặt hàng</h3>
        <input id="customer" placeholder="Họ và tên">
        <input id="phone" placeholder="Số điện thoại">
        <textarea id="address" placeholder="Địa chỉ giao hàng"></textarea>

        <button class="order-btn" onclick="checkout()">
            ĐẶT HÀNG NGAY
        </button>
    </section>

</div>

<footer>
    © 2026 MyShop - Website bán hàng
</footer>

<script>
const products = [
    {
        id: 1,
        name: "Áo thun nam",
        price: 150000,
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"
    },
    {
        id: 2,
        name: "Giày thể thao",
        price: 450000,
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
    },
    {
        id: 3,
        name: "Đồng hồ thời trang",
        price: 650000,
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
    },
    {
        id: 4,
        name: "Ba lô cao cấp",
        price: 350000,
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"
    }
];

let cart = [];

function money(number) {
    return number.toLocaleString("vi-VN") + "đ";
}

function renderProducts() {
    const keyword = document.getElementById("search").value.toLowerCase();

    const filtered = products.filter(p =>
        p.name.toLowerCase().includes(keyword)
    );

    document.getElementById("products").innerHTML =
        filtered.map(p => `
            <div class="product">
                <img src="${p.image}" alt="${p.name}">
                <div class="product-info">
                    <h3>${p.name}</h3>
                    <div class="price">${money(p.price)}</div>
                    <button class="add-btn" onclick="addToCart(${p.id})">
                        + Thêm vào giỏ
                    </button>
                </div>
            </div>
        `).join("") || "Không tìm thấy sản phẩm.";
}

function addToCart(id) {
    const item = cart.find(p => p.id === id);

    if(item) {
        item.quantity++;
    } else {
        const product = products.find(p => p.id === id);
        cart.push({...product, quantity: 1});
    }

    renderCart();
}

function changeQuantity(id, amount) {
    const item = cart.find(p => p.id === id);

    if(!item) return;

    item.quantity += amount;

    if(item.quantity <= 0) {
        cart = cart.filter(p => p.id !== id);
    }

    renderCart();
}

function renderCart() {
    const cartItems = document.getElementById("cart-items");
    const count = cart.reduce((sum, p) => sum + p.quantity, 0);

    document.getElementById("count").innerText = count;

    if(cart.length === 0) {
        cartItems.innerHTML = "Chưa có sản phẩm nào.";
    } else {
        cartItems.innerHTML = cart.map(p => `
            <div class="cart-item">
                <div>
                    <b>${p.name}</b><br>
                    ${money(p.price)} x ${p.quantity}
                </div>
                <div>
                    <button onclick="changeQuantity(${p.id}, -1)">−</button>
                    <button onclick="changeQuantity(${p.id}, 1)">+</button>
                </div>
            </div>
        `).join("");
    }

    const total = cart.reduce(
        (sum, p) => sum + p.price * p.quantity, 0
    );

    document.getElementById("total").innerText = money(total);
}

function goToCart() {
    document.getElementById("cart").scrollIntoView({
        behavior: "smooth"
    });
}

function checkout() {
    if(cart.length === 0) {
        alert("Giỏ hàng đéo có gì hết");
        return;
    }

    const customer = document.getElementById("customer").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();

    if(!customer || !phone || !address) {
        alert("Vui lòng nhập đầy đủ thông tin!");
        return;
    }

    const total = cart.reduce(
        (sum, p) => sum + p.price * p.quantity, 0
    );

    const order = cart.map(p =>
        `${p.name} x ${p.quantity}`
    ).join("\n");

    alert(
        "ĐẶT HÀNG THÀNH CÔNG!\n\n" +
        "Khách hàng: " + customer +
        "\nSĐT: " + phone +
        "\nĐịa chỉ: " + address +
        "\n\nSản phẩm:\n" + order +
        "\n\nTổng tiền: " + money(total)
    );

    cart = [];
    renderCart();
}

renderProducts();
renderCart();
</script>

</body>
</html>
